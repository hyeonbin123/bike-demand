[project]
name = "bike-demand"
version = "0.1.0"
requires-python = ">=3.11"
# 상한(2026-10-04): DuckDB 2.0(새 기본 저장 형식), SQLAlchemy 2.1, dbt-core 2.0이 열린 하한으로
# 다음 `uv lock --upgrade`에 들어오지 않게 막는다. 올리는 일은 warehouse를 다시 만드는 2027년 초
# refresh_history 때 구·신 DuckDB 결과 해시 비교와 함께 한다. dbt-core는 dbt-duckdb가 끌어오며
# 여기에는 상한만 둔다.
dependencies = [
    "alembic>=1.20.0",
    "dbt-core<2",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5,<2",
    "fastapi>=0.141.1",
    "holidays>=0.104",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "scipy>=1.17",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bike_demand"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# alembic/ 폴더(마이그레이션)가 있어 패키지 alembic을 내부 모듈로 잘못 분류하지 않게 함
known-third-party = ["alembic"]
# airflow/dags의 공통 모듈(Airflow가 dags 폴더를 import 경로에 넣음)
known-first-party = ["bike_demand", "bike_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"  # 기본 임시 폴더는 이 PC에서 권한 오류. 새 클론에도 있는 위치여야 함
