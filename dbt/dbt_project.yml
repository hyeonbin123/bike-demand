name: bike_demand
version: "0.1.0"
profile: bike_demand
config-version: 2

# 저장소 루트에서 실행한다: uv run dbt build --project-dir dbt --profiles-dir dbt
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  data_dir: "data"
  # 달력(dim_hours)과 격자의 기간. refresh_history는 원본 최신 달 말일을 --vars calendar_end로 넘긴다(T32).
  # 새 반기를 넣고 손으로 빌드할 때도 넘겨야 한다. 빠뜨리면 assert_calendar_covers_rentals가 실패한다
  calendar_start: "2023-01-01"
  calendar_end: "2026-06-30"

models:
  bike_demand:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  bike_demand:
    kr_holidays:
      +column_types:
        holiday_date: date
        holiday_name: varchar
