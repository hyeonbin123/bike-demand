version: 2

models:
  - name: stg_trips
    description: "대여 한 건 = 한 행. 중복 제거, 대여 취소 표시"
    columns:
      - name: rented_at
        data_tests: [not_null]
      - name: rent_station_id
        data_tests: [not_null]
      - name: duration_min
        data_tests: [not_null]
      - name: is_cancelled
        description: "이용시간 0분 이하이고 빌린 대여소에 반납"

  - name: stg_stations
    description: "대여소 정보 반기 스냅샷"
    data_tests:
      - unique:
          column_name: "snapshot || '|' || station_no"
    columns:
      - name: station_no
        data_tests: [not_null]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]
